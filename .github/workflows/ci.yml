name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: event_booking
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_test_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    # These are consumed by application.yml — BookingConcurrencyTest and
    # friends boot the full Spring context, so real MySQL/Redis are required,
    # not mocked.
    env:
      DB_URL: jdbc:mysql://localhost:3306/event_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ci_test_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # Test-only secret — never used outside CI, does not need to be a real secret.
      JWT_SECRET: ci-test-only-secret-value-not-used-anywhere-else-32chars-min
      # Also required with no default in application.yml (AdminInitializer)
      # — every @SpringBootTest fails to boot without this, same class of
      # error as the local "Access denied" / missing-env issues.
      ADMIN_PASSWORD: ci-test-only-admin-password-not-used-anywhere-else

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Run tests
        run: ./mvnw -B test

      - name: Publish test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Build jar
        run: ./mvnw -B package -DskipTests