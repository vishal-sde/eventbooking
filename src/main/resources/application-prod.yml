spring:
  jpa:
    hibernate:

      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      password: ${REDIS_PASSWORD}
      ssl:
        # Managed Redis providers (Render, Upstash) require TLS — self-hosted
        # Redis running as a plain container next to the app (e.g. on EC2 via
        # docker-compose) does not have TLS configured, so this must be false
        # there. Override with REDIS_SSL_ENABLED=true only when pointing at a
        # managed provider that requires it.
        enabled: ${REDIS_SSL_ENABLED:false}
  datasource:
    hikari:

      maximum-pool-size: 5
      minimum-idle: 2

logging:
  level:
    root: INFO
    com.eventbooking: INFO

    org.springframework.transaction: WARN
    org.hibernate.SQL: WARN


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


server:
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never