spring:
  jpa:
    hibernate:

      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
  datasource:
    hikari:

      maximum-pool-size: 5
      minimum-idle: 2

logging:
  level:
    root: INFO
    com.eventbooking: INFO

    org.springframework.transaction: WARN
    org.hibernate.SQL: WARN


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


server:
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never