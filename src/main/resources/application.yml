spring:
  application:
    name: eventbooking

  # MySQL database
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/event_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: EventBookingPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema now — Hibernate only verifies entities match it.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true

  # Redis — must be under spring.data (was incorrectly at root level before)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # SMTP — disabled by default (app.mail.enabled) so the app boots fine with no mail server configured.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# HTTP server
server:
  port: ${PORT:8081}
  servlet:
    context-path: /

# The mail starter auto-registers a health check that tries to connect to
# the SMTP server on every /actuator/health poll. EmailService already
# handles send failures gracefully without breaking the app, so a flaky or
# unreachable mail server should never flip the container to "unhealthy".
management:
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD}
    name: ${ADMIN_NAME:Administrator}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:Evently <no-reply@evently.app>}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  rate-limit:
    login:
      capacity: ${RATE_LIMIT_LOGIN_CAPACITY:5}       # max attempts...
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:60}  # ...per this many seconds, per IP
    signup:
      capacity: ${RATE_LIMIT_SIGNUP_CAPACITY:10}
      window-seconds: ${RATE_LIMIT_SIGNUP_WINDOW:3600}

# Logging
logging:
  level:
    com.eventbooking: DEBUG
    org.springframework.transaction: DEBUG
    org.hibernate.SQL: DEBUG