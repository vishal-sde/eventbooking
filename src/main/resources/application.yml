spring:
  application:
    name: eventbooking

  # MySQL database
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/event_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: EventBookingPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema now — Hibernate only verifies entities match it.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true

  # Redis — must be under spring.data (was incorrectly at root level before)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# HTTP server
server:
  port: ${PORT:8081}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD}
    name: ${ADMIN_NAME:Administrator}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from-name: ${MAIL_FROM_NAME:Evently}
    from-email: ${MAIL_FROM_EMAIL:}
  google:

    client-id: ${GOOGLE_CLIENT_ID:}

    mail-client-id: ${GOOGLE_MAIL_CLIENT_ID:}
    mail-client-secret: ${GOOGLE_MAIL_CLIENT_SECRET:}
    mail-refresh-token: ${GOOGLE_MAIL_REFRESH_TOKEN:}
  rate-limit:
    login:
      capacity: ${RATE_LIMIT_LOGIN_CAPACITY:5}       # max attempts...
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:60}  # ...per this many seconds, per IP
    signup:
      capacity: ${RATE_LIMIT_SIGNUP_CAPACITY:10}
      window-seconds: ${RATE_LIMIT_SIGNUP_WINDOW:3600}
# Logging
logging:
  level:
    com.eventbooking: DEBUG
    org.springframework.transaction: DEBUG
    org.hibernate.SQL: DEBUG